name: Bump version

# Actions → Bump version → Run workflow, then pick major, minor or patch. This bumps every
# copy of the version (tools/ci/version.py), writes the CHANGELOG entry, commits
# "Release X.Y.Z" to main and starts the Release workflow, which runs CI, tags vX.Y.Z,
# publishes the GitHub release and syncs the add-on store.
#
# CHANGELOG entry: a "## Unreleased" section (optionally "## Unreleased — title") at the
# top of anti_matter/CHANGELOG.md becomes the new version's entry. Without one, the entry
# lists the commit subjects since the last release. "dry run" shows the result in the
# run summary without committing anything.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [minor, major, patch]
        default: minor
      summary:
        description: CHANGELOG title after the version (optional; default is the "## Unreleased — title")
        type: string
        required: false
      dry_run:
        description: Dry run (show the bump, commit nothing)
        type: boolean
        default: false

permissions:
  contents: write # push the release commit
  actions: write # start the Release workflow

# Same group as release.yml: never bump while a release is still running.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    name: Bump ${{ inputs.bump }}${{ inputs.dry_run && ' (dry run)' || '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on main (it was started on $GITHUB_REF)"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history: the release check and commit-subject notes need them

      - name: Bump the version and write the CHANGELOG entry
        id: v
        env:
          BUMP: ${{ inputs.bump }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          old=$(python3 tools/ci/version.py get)
          new=$(python3 tools/ci/version.py next "$BUMP")
          if ! git rev-parse -q --verify "refs/tags/v$old" >/dev/null; then
            echo "::error::v$old is not released yet. Finish that release first (re-run the Release workflow), or the bump would skip it."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then
            echo "::error::v$new is already tagged"
            exit 1
          fi
          if [ "$(git rev-list --count "v$old..HEAD")" = 0 ]; then
            echo "::error::Nothing to release: main has no commits since v$old"
            exit 1
          fi
          python3 tools/ci/version.py bump "$BUMP" --from-git --summary "$SUMMARY"
          python3 tools/ci/version.py notes "$new" > "$RUNNER_TEMP/notes.md" # fails on an empty entry
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          {
            echo "### $old → $new"
            echo
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo '<details><summary>Changed files</summary>'
            echo
            echo '```'
            git diff --stat
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push to main
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.v.outputs.new }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $VERSION"
          git push origin "HEAD:main"

      # A push made with GITHUB_TOKEN does not trigger release.yml's push trigger, but a
      # workflow_dispatch does: start it explicitly, on the commit just pushed.
      - name: Start the Release workflow
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.new }}
        run: |
          gh workflow run release.yml --ref main
          echo "Started the Release workflow for v$VERSION: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/release.yml" >> "$GITHUB_STEP_SUMMARY"
