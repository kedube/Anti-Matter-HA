configuration:
  interface:
    name: الواجهة
    fields:
      language:
        name: اللغة
        description: >-
          لغة التطبيق. يتبع خيار «Auto» لغة Home Assistant، ثم لغة المتصفح. تُعرض كل لغة
          باسمها الأصلي. تُحفظ اللغة التي تختارها مباشرةً داخل التطبيق لكل متصفح على
          حدة، وتكون لها الأولوية على هذا الإعداد.
      theme:
        name: السمة
        description: >-
          سمة الألوان: «Light» (فاتحة) أو «Dark» (داكنة). يتبع خيار «Auto» إعداد الوضع
          الفاتح/الداكن في Home Assistant.
  backup:
    name: النسخ الاحتياطي
    fields:
      keep_count:
        name: عدد النسخ الاحتياطية المحفوظة
        description: >-
          عدد النسخ الاحتياطية ذات الطابع الزمني التي يُحتفظ بها في مجلد إعدادات الإضافة
          (المتاح عبر SAMBA). تُحذف النسخ الأقدم تلقائيًا.
