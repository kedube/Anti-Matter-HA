configuration:
  interface:
    name: Interface
    fields:
      language:
        name: Taal
        description: >-
          Taal van de app. "Auto" volgt de taal van je Home Assistant, daarna je
          browser. Elke taal staat vermeld onder haar eigen naam. Een taal die je in de
          app zelf kiest, wordt per browser onthouden en gaat voor op deze instelling.
      theme:
        name: Thema
        description: >-
          Kleurthema: "Light" (licht) of "Dark" (donker). "Auto" volgt de
          licht/donker-instelling van je Home Assistant.
  backup:
    name: Back-up
    fields:
      keep_count:
        name: Aantal back-ups bewaren
        description: >-
          Hoeveel back-upkopieën met tijdstempel bewaard blijven in de add-on config-map
          (bereikbaar via SAMBA). Oudere worden automatisch opgeruimd.
