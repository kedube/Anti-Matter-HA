configuration:
  interface:
    name: Интерфейс
    fields:
      language:
        name: Язык
        description: >-
          Язык приложения. «Auto» использует язык Home Assistant, а затем язык браузера.
          Каждый язык указан под собственным названием. Язык, выбранный непосредственно
          в приложении, запоминается для каждого браузера отдельно и имеет приоритет над
          этой настройкой.
      theme:
        name: Тема
        description: >-
          Цветовая тема: «Light» (светлая) или «Dark» (тёмная). «Auto» следует настройке
          светлой/тёмной темы Home Assistant.
  backup:
    name: Резервное копирование
    fields:
      keep_count:
        name: Сколько резервных копий хранить
        description: >-
          Сколько резервных копий с отметкой времени хранить в папке конфигурации
          дополнения (доступна по SAMBA). Более старые копии удаляются автоматически.
