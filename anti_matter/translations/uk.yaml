configuration:
  interface:
    name: Інтерфейс
    fields:
      language:
        name: Мова
        description: >-
          Мова застосунку. «Auto» використовує мову Home Assistant, а потім мову
          браузера. Кожну мову вказано її власною назвою. Мова, вибрана безпосередньо в
          застосунку, запам’ятовується для кожного браузера окремо й має пріоритет над
          цим налаштуванням.
      theme:
        name: Тема
        description: >-
          Колірна тема: «Light» (світла) або «Dark» (темна). «Auto» відповідає
          налаштуванню світлої/темної теми Home Assistant.
  backup:
    name: Резервне копіювання
    fields:
      keep_count:
        name: Скільки резервних копій зберігати
        description: >-
          Скільки резервних копій із позначкою часу зберігати в теці конфігурації
          доповнення (доступна через SAMBA). Старіші копії видаляються автоматично.
